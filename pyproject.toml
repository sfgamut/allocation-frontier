[project]
name = "allocation-frontier"
version = "0.3.0"
description = "Optimización de portafolios research-grade: estimadores robustos, Black-Litterman y walk-forward sin lookahead con weight drift y costes pathwise."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "scipy>=1.13",
    "matplotlib>=3.9",
]

[project.optional-dependencies]
data = ["yfinance>=0.2"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "scikit-learn>=1.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["allocation_frontier"]

[tool.ruff]
line-length = 100
