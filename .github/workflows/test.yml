name: allocation-tests

on:
  pull_request:
    paths:
      - "allocation_frontier/**"
      - "tests/**"
      - "notebooks/demo.py"
      - "pyproject.toml"
      - ".github/workflows/test.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: allocation-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install package and test dependencies
        run: python -m pip install -e . pytest scikit-learn
      - name: Unit tests
        run: python -m pytest -q
      - name: Compile package
        run: python -m compileall -q allocation_frontier
      - name: End-to-end smoke demo
        run: ALLOC_FRONTIER_SMOKE=1 python notebooks/demo.py
