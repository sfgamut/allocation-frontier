[project]
name = "allocation-frontier"
version = "0.2.0"
description = "Optimización de portafolios research-grade: estimadores robustos de covarianza (Ledoit-Wolf, RMT), Black-Litterman, frontera resampleada y backtest walk-forward sin lookahead."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "scipy>=1.13",
    "matplotlib>=3.9",
]

[project.optional-dependencies]
data = ["yfinance>=0.2"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "scikit-learn>=1.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["allocation_frontier"]

[tool.ruff]
line-length = 100
